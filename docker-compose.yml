services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ownlevel
      POSTGRES_PASSWORD: ownlevel
      POSTGRES_DB: ownlevel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownlevel"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
