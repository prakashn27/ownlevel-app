name: Deploy mcp

on:
  push:
    branches: [main]
    paths:
      - "apps/mcp-server/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/mcp-server... run --if-present typecheck
      # Fail before deploying if the Worker does not bundle.
      - run: pnpm --filter ./apps/mcp-server cf:dry
      - run: pnpm --filter ./apps/mcp-server cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
